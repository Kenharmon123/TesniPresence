[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self' https:; img-src 'self' data: https:; media-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/business-loans"
  to = "/services/business-loans"
  status = 301
[[redirects]]
  from = "/lines-of-credit"
  to = "/services/business-lines-of-credit"
  status = 301
[[redirects]]
  from = "/cre-loans"
  to = "/services/commercial-real-estate-loans"
  status = 301
[[redirects]]
  from = "/dscr-loans"
  to = "/services/dscr-loans"
  status = 301
[[redirects]]
  from = "/investment-loans"
  to = "/services/real-estate-investment-loans"
  status = 301
